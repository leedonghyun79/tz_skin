<style>
/* --- Custom Channel Talk Button --- */
.custom-ch-btn {
    position: fixed !important;
    right: 12px !important;
    bottom: 20px !important; /* Default bottom */
    width: 60px !important;
    z-index: 400 !important;
    display: block !important;
    border-radius: 50%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    overflow: hidden;
    background: #fff;
}
.custom-ch-btn img {
    width: 100%;
    height: auto;
    display: block;
}
@media all and (max-width: 480px) {
    .custom-ch-btn {
        right: 10px !important;
        bottom: 10px !important;
        width: 55px !important;
        height: 55px !important;
    }
}

.qm-wrap.mobile-qm {
    bottom: 75px !important;
}

/* Hide original Channel Talk launcher */
div[class*="ChatButtonContainer__Container-ch-front"],
.ch-plugin-launcher,
.ch-launcher,
.ch-plugin-entry,
#ch-plugin-entry {
    display: none !important;
}

/* --- Detail Page Overrides (Activated when orderFixArea is visible) --- */
@media all and (max-width: 480px) {
    body:has(#orderFixArea:not([style*="none"]):not(.displaynone)) .custom-ch-btn {
        bottom: 125px !important;
    }
}
body:has(#orderFixArea:not([style*="none"]):not(.displaynone)) .qm-wrap.mobile-qm {
    bottom: 193px !important;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Escape any local stacking context by moving the buttons to the body root
    var btn = document.querySelector(".custom-ch-btn");
    var qm = document.querySelector(".qm-wrap.mobile-qm");
    if(btn) document.body.appendChild(btn);
    if(qm) document.body.appendChild(qm);

    // Fallback for older browsers that don't support CSS :has()
    if (!CSS.supports('selector(:has(a))')) {
        var checkOrderFix = function() {
            var orderFix = document.getElementById("orderFixArea");
            if (orderFix && orderFix.style.display !== "none" && !orderFix.classList.contains("displaynone")) {
                if (btn) btn.style.setProperty("bottom", "125px", "important");
                if (qm) qm.style.setProperty("bottom", "193px", "important");
            } else {
                if (btn) btn.style.setProperty("bottom", window.innerWidth <= 480 ? "10px" : "20px", "important");
                if (qm) qm.style.setProperty("bottom", "75px", "important");
            }
        };
        checkOrderFix();
        // optionally observe changes to orderFixArea if it toggles, or just rely on initial state
    }
});
</script>
