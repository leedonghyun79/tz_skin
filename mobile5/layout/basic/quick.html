<style>
    /* --- Custom Channel Talk Button --- */
    .custom-ch-btn {
        position: fixed !important;
        right: 12px !important;
        bottom: 20px !important;
        /* Default bottom */
        width: 55px !important;
        height: 52px !important;
        z-index: 400 !important;
        display: block !important;
        border-radius: 10%;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        background: #fff;
        border: none;
        padding: 0;
        outline: none;
        cursor: pointer;
    }

    .custom-ch-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.05);
    }

    @media all and (max-width: 480px) {
        .custom-ch-btn {
            right: 11px !important;
            bottom: 63px !important;
            width: 53px !important;
            height: 53px !important;
        }
    }

    .qm-wrap.mobile-qm {
        bottom: 130px !important;
    }

    /* Position HappyTalk Button on the Left Bottom */
    #happytalk-iframe-button,
    #ht-widget-button,
    #happytalk-widget-button-wrap,
    #happytalk-widget-container,
    [id*="happytalk-"] {
        bottom: 20px !important;
        left: 12px !important;
        right: auto !important;
        z-index: 399 !important;
        transition: bottom 0.3s ease;
    }

    @media all and (max-width: 480px) {

        #happytalk-iframe-button,
        #ht-widget-button,
        #happytalk-widget-button-wrap,
        #happytalk-widget-container,
        [id*="happytalk-"] {
            bottom: 10px !important;
            left: 10px !important;
            right: auto !important;
        }
    }

    /* Hide original Channel Talk launcher */
    div[class*="ChatButtonContainer__Container-ch-front"],
    .ch-plugin-launcher,
    .ch-launcher,
    .ch-plugin-entry,
    #ch-plugin-entry {
        display: none !important;
    }

    /* Hide orderFixArea via CSS if all buttons inside are hidden */
    #orderFixArea:not(:has(.btnNormal:not(.displaynone))):not(:has(.btnStrong:not(.displaynone))) {
        display: none !important;
    }

    /* --- Detail Page Overrides (Activated when orderFixArea is visible and not empty) --- */
    @media all and (max-width: 480px) {
        body.order-fix-visible .custom-ch-btn {
            bottom: 123px !important;
        }

        body.order-fix-visible #happytalk-iframe-button,
        body.order-fix-visible #ht-widget-button,
        body.order-fix-visible #happytalk-widget-button-wrap,
        body.order-fix-visible [id*="happytalk-"][id*="button"] {
            bottom: 190px !important;
        }
    }

    body.order-fix-visible .qm-wrap.mobile-qm {
        bottom: 185px !important;
    }
</style>

<script>
// Javascript fallback: hide orderFixArea if it has no visible buttons
document.addEventListener("DOMContentLoaded", function() {
    var fixArea = document.getElementById('orderFixArea');
    if (fixArea) {
        var hasVisibleBtn = false;
        var btns = fixArea.querySelectorAll('.btnNormal, .btnStrong');
        for (var i = 0; i < btns.length; i++) {
            if (!btns[i].classList.contains('displaynone') && btns[i].style.display !== 'none') {
                hasVisibleBtn = true;
                break;
            }
        }
        if (!hasVisibleBtn) {
            fixArea.style.setProperty('display', 'none', 'important');
            fixArea.classList.add('displaynone');
        } else {
            // Add a class to body so CSS can reliably target elements without complex :has()
            document.body.classList.add('order-fix-visible');
        }
    }
});
</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Escape any local stacking context by moving the buttons to the body root
        var btn = document.querySelector(".custom-ch-btn");
        var qm = document.querySelector(".qm-wrap.mobile-qm");
        if (btn) document.body.appendChild(btn);
        if (qm) document.body.appendChild(qm);

        // Fallback for older browsers that don't support CSS :has()
        if (!CSS.supports('selector(:has(a))')) {
            var checkOrderFix = function () {
                var orderFix = document.getElementById("orderFixArea");
                var htBtns = document.querySelectorAll('#happytalk-iframe-button, #ht-widget-button, #happytalk-widget-button-wrap, [id*="happytalk-"][id*="button"]');

                if (orderFix && orderFix.style.display !== "none" && !orderFix.classList.contains("displaynone")) {
                    if (btn) btn.style.setProperty("bottom", "125px", "important");
                    if (qm) qm.style.setProperty("bottom", "258px", "important");
                    htBtns.forEach(function (el) { el.style.setProperty("bottom", "190px", "important"); });
                } else {
                    if (btn) btn.style.setProperty("bottom", window.innerWidth <= 480 ? "10px" : "20px", "important");
                    if (qm) qm.style.setProperty("bottom", "140px", "important");
                    htBtns.forEach(function (el) { el.style.setProperty("bottom", window.innerWidth <= 480 ? "75px" : "80px", "important"); });
                }
            };
            checkOrderFix();
        }

        // Aggressively force HappyTalk to the left side (overrides any inline !important styles)
        var htInterval = setInterval(function () {
            var htBtns = document.querySelectorAll('#happytalk-iframe-button, #ht-widget-button, #happytalk-widget-button-wrap, #happytalk-widget-container, [id*="happytalk-"]');
            if (htBtns.length > 0) {
                htBtns.forEach(function (el) {
                    el.style.setProperty("left", window.innerWidth <= 480 ? "10px" : "12px", "important");
                    el.style.setProperty("right", "auto", "important");
                });
            }
        }, 500);

    });
</script>
