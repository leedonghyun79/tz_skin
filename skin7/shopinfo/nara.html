      }
      .tz-proc .tz-cnt {

      }
      .tz-proc .tz-vbtn {

        color: #666;
        font-size: 15px;
        line-height: 1;

      .tz-proc .tz-vbtn.on {

        color: #fff;
        border-color: #0080ff;
      }
      .tz-proc .tz-filters {

      }
      .tz-proc .tz-filters select,

        font-size: 15px;

        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        color: #1a1a1a;
        height: 38px;
        outline: none;
        font-family: inherit;
      }
      .tz-proc .tz-filters select:focus,

      }
      .tz-proc .tz-search {

      }
      .tz-proc .tz-reset {

        height: 38px;
        font-family: inherit;
      }
      .tz-proc .tz-reset:hover {
        background: #f0f0f0;
      }

        scrollbar-width: none;

      }
      .tz-proc .tz-tabs::-webkit-scrollbar {
        display: none;
      }
      .tz-proc .tz-tab {
        font-size: 15px;
        padding: 8px 14px;
        cursor: pointer;
        color: #101010;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
        user-select: none;
      }
      .tz-proc .tz-tab.on {
        color: #101010;
        border-bottom-color: #101010;
        font-weight: 600;
      }
      .tz-proc .tz-tab:hover:not(.on) {
        color: #333;
      }

      /* 카드 그리드 */
      .tz-proc .tz-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      .tz-proc .tz-card {
        background: #fff;
        overflow: hidden;
        transition: border-color 0.15s, box-shadow 0.15s;
        display: flex;
        flex-direction: column;
      }

      /* 카드 이미지 영역 */
      .tz-proc .tz-card-img {
        width: 100%;
        border: 1px solid #e8e8e8;
        aspect-ratio: 1/1;
        overflow: hidden;
        flex-shrink: 0;
      }

      .tz-proc .tz-card-img:hover {
        border-color: #0080ff;
        box-shadow: 0 2px 12px rgba(0, 128, 255, 0.1);
      }

      .tz-proc .tz-card-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        padding: 12px;
        transition: transform 0.2s;
      }
      .tz-proc .tz-card:hover .tz-card-img img {
        transform: scale(1.04);
      }

      /* 카드 바디 */
      .tz-proc .tz-card-body {
        padding: 10px 0px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }
      .tz-proc .tz-badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 7px;
      }
      .tz-proc .tz-model {

        font-weight: 700;
        color: #1a1a1a;
        line-height: 1.3;

      .tz-proc .tz-meta {
        display: flex;
        flex-direction: column;
        gap: 0;
        overflow: hidden;
      }
      .tz-proc .tz-meta-row {

        align-items: center;
        padding: 2px 10px;
        gap: 12px;
      }

      .tz-proc .tz-meta-label {

        white-space: nowrap;

      }

      }

      .tz-proc .tz-pg {

        border-radius: 8px;
        background: #fff;

        color: #555;

        justify-content: center;
        font-family: inherit;

        function cls(c) { return (CAT_META[c] && CAT_META[c].cls) || "bg-stand"; }
        function lbl(c) { return (CAT_META[c] && CAT_META[c].label) || c; }

        /**
         * 모델명에서 이미지 키를 결정한다.
         *
         * 모델명 패턴: TZ-(ST|SW)(4300|4900|5500|6500)-(MN|AN|PN|AT|PT)
         *   - suffix AT 또는 PT → 터치스크린(f) 이미지
         *   - suffix MN / AN / PN → 일반 이미지
         *
         * 전자액자(PW), LED, 셋탑, 교육은 cat으로 처리.
         */
        function getImg(cat, source, model) {
          if (source === "venture") return SERIES_IMG["PW_VENTURE"];
          if (cat === "전자액자")       return SERIES_IMG["PW"];
          if (cat === "LED 안내전광판") return SERIES_IMG["LED"];
          if (cat === "셋탑박스")       return SERIES_IMG["SET"];
          if (cat === "사용자교육")     return SERIES_IMG["EDU"];

          // 스탠드 / 회전형 → 모델명 파싱
          // 터치스크린 suffix: AT, PT
          const mTouch = model.match(/TZ-(ST|SW)(\d{4})-(AT|PT)/);
          if (mTouch) {
            const key = mTouch[1] + mTouch[2] + "f"; // e.g. ST4300f, SW4300f
            const fallback = mTouch[1] === "SW" ? "https://cdn.imweb.me/thumbnail/20260327/ed5d6ae7df2f7.png" : "";
            return SERIES_IMG[key] || fallback;
          }
          // 일반 suffix: MN, AN, PN
          const mNorm = model.match(/TZ-(ST|SW)(\d{4})/);
          if (mNorm) {
            const key = mNorm[1] + mNorm[2]; // e.g. ST4300, SW4300
            const fallback = mNorm[1] === "SW" ? "https://cdn.imweb.me/thumbnail/20260327/ed5d6ae7df2f7.png" : "";
            return SERIES_IMG[key] || fallback;
          }

          return "";
        }

        // ─── 뷰 전환 ────────────────────────────────────────────────────

          document.getElementById("tz-btnList").classList.toggle("on", v === "list");
          document.getElementById("tz-grid").style.display  = v === "card" ? "grid"  : "none";
          document.getElementById("tz-list").style.display  = v === "list" ? "block" : "none";
          render();

        // ─── 필터링 ──────────────────────────────────────────────────────
        function applyFilter() {
          const q  = document.getElementById("tz-search").value.toLowerCase().replace(/\s/g, "");
          const os = document.getElementById("tz-os").value;
          filtered = DATA.filter(function (d) {
            if (tab && d.cat !== tab) return false;
            if (os  && d.os  !== os)  return false;
            if (q) {
              const haystack = (
                d.model +
                (d.g2b_cls || "") +
                (d.g2b     || "") +
                (d.s2b     || "") +
                (d.vn_item || "") +
                (d.vn_detail || "")
              ).toLowerCase().replace(/\s/g, "");
              if (haystack.indexOf(q) < 0) return false;
            }
            return true;
          });
        }

        // ─── 카드 렌더 ───────────────────────────────────────────────────
        function renderCards(slice) {

          el.innerHTML = slice.map(function (d) {

                '<div class="tz-meta-row"><span class="tz-meta-label">조달금액</span><span class="tz-meta-val" style="font-family:inherit;color:#1a1a1a;font-weight:500">₩ ' + d.price.toLocaleString() + "</span></div>";
            }

                return "<tr>" + badgeCell + modelCell + col1 + col2 + col3 + osCell + priceCell + "</tr>";
              } else {
                return "<tr>" + badgeCell + modelCell + col1 + col2 + col3 + osCell + priceCell + "</tr>";
              }
            }
          }).join("");
        }

        // ─── 페이저 ──────────────────────────────────────────────────────
        function renderPager() {
          const total = Math.ceil(filtered.length / PER);
          const pg = document.getElementById("tz-pager");
          if (total <= 1) { pg.innerHTML = ""; return; }
          let h = '<button class="tz-pg" onclick="tzGo(' + (page - 1) + ')" ' + (page === 1 ? "disabled" : "") + ">‹</button>";
          const s = Math.max(1, page - 2), e = Math.min(total, page + 2);
          if (s > 1) h += '<button class="tz-pg" onclick="tzGo(1)">1</button>' + (s > 2 ? '<span style="padding:0 4px;color:#aaa">…</span>' : "");
          for (let i = s; i <= e; i++)
            h += '<button class="tz-pg' + (i === page ? " on" : "") + '" onclick="tzGo(' + i + ')">' + i + "</button>";
          if (e < total)
            h += (e < total - 1 ? '<span style="padding:0 4px;color:#aaa">…</span>' : "") + '<button class="tz-pg" onclick="tzGo(' + total + ')">' + total + "</button>";
          h += '<button class="tz-pg" onclick="tzGo(' + (page + 1) + ')" ' + (page === total ? "disabled" : "") + ">›</button>";
          h += '<span class="tz-pginfo">' + page + " / " + total + " 페이지</span>";
          pg.innerHTML = h;
        }

        function tzGo(p) {
          const total = Math.ceil(filtered.length / PER);
          if (p < 1 || p > total) return;
          page = p;
          const slice = filtered.slice((p - 1) * PER, p * PER);
          if (view === "card") renderCards(slice);
          else renderList(slice);
          renderPager();
          const top = document.querySelector(".tz-proc");
          if (top) top.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        window.tzGo = tzGo;

        // ─── 메인 렌더 ───────────────────────────────────────────────────
        function render() {
          applyFilter();
          document.getElementById("tz-cnt").textContent = filtered.length + "개";
          page = 1;
          const slice = filtered.slice(0, PER);
          updateThead();
          if (view === "card") renderCards(slice);
          else renderList(slice);
          renderPager();
        }

        document.getElementById("tz-search").addEventListener("input",  function () { page = 1; render(); });
        document.getElementById("tz-os").addEventListener("change", function () { page = 1; render(); });

        function tzReset() {
          document.getElementById("tz-search").value = "";
          document.getElementById("tz-os").value = "";
          tab = "";
          page = 1;
          document.querySelectorAll("#tz-tabs .tz-tab").forEach(function (x, i) {
            x.classList.toggle("on", i === 0);
          });
          render();
        }
        window.tzReset = tzReset;

        render();
      })();
    </script>
</div>
