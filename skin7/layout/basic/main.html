        <script>
        (function(){var w=window;if(w.ChannelIO){return w.console.error("ChannelIO script included twice.");}var ch=function(){ch.c(arguments);};ch.q=[];ch.c=function(args){ch.q.push(args);};w.ChannelIO=ch;function l(){if(w.ChannelIOInitialized){return;}w.ChannelIOInitialized=true;var s=document.createElement("script");s.type="text/javascript";s.async=true;s.src="https://cdn.channel.io/plugin/ch-plugin-web.js";var x=document.getElementsByTagName("script")[0];if(x.parentNode){x.parentNode.insertBefore(s,x);}}if(document.readyState==="complete"){l();}else{w.addEventListener("DOMContentLoaded",l);w.addEventListener("load",l);}})();

        try{ 
            ChannelIO('boot', {

                <script>
                (function(){
                    function diag(){
                        console.info('ChannelIO diag: window.ChannelIO ->', !!window.ChannelIO);
                        if(!window.ChannelIO){ console.warn('ChannelIO not defined. Check network/CSP/adblocker.'); return; }
                        try{
                            console.info('ChannelIO queue length:', (window.ChannelIO.q && window.ChannelIO.q.length) || 0 );
                            console.info('ChannelIO ready; messenger will not open automatically.');
                        }catch(e){ console.error(e); }
                    }
                    if(document.readyState==='complete'){ diag(); } else { window.addEventListener('load', diag); }
                })();
                </script>
                <script>
                (function(){
                    function diagAll(){
                        try{
                            console.group('ChannelIO Diagnostic');
                            console.log('typeof window.ChannelIO ->', typeof window.ChannelIO);
                            console.log('window.ChannelIOInitialized ->', !!window.ChannelIOInitialized);
                            var scripts = Array.from(document.querySelectorAll('script[src*="ch-plugin-web.js"]'));
                            console.log('ch-plugin-web.js script tags found:', scripts.length);
                            scripts.forEach(function(s,i){ console.log('script['+i+'] src=', s.src); });
                            console.log('ChannelIO.q length ->', (window.ChannelIO && window.ChannelIO.q && window.ChannelIO.q.length) || 0);
                            var launcher = document.getElementById('custom-channelio-launcher');
                            console.log('custom launcher element ->', !!launcher, launcher && getComputedStyle(launcher).display, launcher && getComputedStyle(launcher).opacity);
                            var url = scripts.length ? scripts[0].src : 'https://cdn.channel.io/plugin/ch-plugin-web.js';
                            fetch(url, {method:'HEAD', cache:'no-store'}).then(function(res){ console.log('fetch HEAD response ok? status=', res.status); }).catch(function(err){ console.warn('fetch HEAD failed (CORS or network):', err); });
                            console.groupEnd();
                        }catch(e){ console.error('ChannelIO diag error', e); }
                    }

                    window.runChannelIODiag = diagAll;

                    try{
                        if(location.search.indexOf('cioDiag=1')>-1){ if(document.readyState==='complete'){ setTimeout(diagAll,120); } else { window.addEventListener('load', function(){ setTimeout(diagAll,120); }); } }
                    }catch(e){ }
                })();
                </script>

                <script>
                (function(){
                    // On-page diagnostic panel + fallback loader for environments where console isn't visible
                    function createPanel(){
                        if(document.getElementById('channelio-diag-panel')) return document.getElementById('channelio-diag-panel');
                        var p=document.createElement('div');
                        p.id='channelio-diag-panel';
                        p.style.position='fixed';p.style.left='12px';p.style.bottom='12px';p.style.width='360px';p.style.maxHeight='60vh';p.style.overflow='auto';p.style.zIndex='2147483646';p.style.background='rgba(0,0,0,0.85)';p.style.color='#fff';p.style.fontSize='13px';p.style.padding='10px';p.style.borderRadius='8px';p.style.boxShadow='0 6px 18px rgba(0,0,0,0.4)';
                        p.innerHTML='<strong style="display:block;margin-bottom:8px">ChannelIO Diag</strong><div id="channelio-diag-logs" style="font-family:monospace;line-height:1.2;max-height:46vh;overflow:auto"></div><div style="margin-top:8px;text-align:right"><button id="channelio-diag-close" style="background:#6c2bd9;color:#fff;border:none;padding:6px 8px;border-radius:4px;cursor:pointer">닫기</button></div>';
                        document.body.appendChild(p);
                        p.querySelector('#channelio-diag-close').addEventListener('click',function(){ p.style.display='none'; });
                        return p;
                    }
                    function panelLog(msg){ try{ var panel=createPanel(); var log=document.createElement('div'); log.textContent = (new Date()).toLocaleTimeString() + ' — ' + msg; panel.querySelector('#channelio-diag-logs').appendChild(log); panel.querySelector('#channelio-diag-logs').scrollTop = panel.querySelector('#channelio-diag-logs').scrollHeight; }catch(e){ console.log('panelLog failed', e); } }

                    function tryLoadPlugin(url, cb){
                        panelLog('Attempting to load: ' + url);
                        var s=document.createElement('script'); s.src=url; s.async=true;
                        s.onload=function(){ panelLog('Plugin script loaded (onload)'); if(cb)cb(null); };
                        s.onerror=function(e){ panelLog('Plugin script failed to load (onerror)'); if(cb)cb(e); };
                        document.head.appendChild(s);
                    }

                    function runFullDiag(){
                        panelLog('Running full diagnostic');
                        panelLog('window.ChannelIO -> ' + (typeof window.ChannelIO));
                        panelLog('ChannelIOInitialized -> ' + !!window.ChannelIOInitialized);
                        var scripts = Array.from(document.querySelectorAll('script[src*="ch-plugin-web.js"]'));
                        panelLog('ch-plugin script tags found: ' + scripts.length);
                        if(scripts.length){ panelLog('first script src: ' + scripts[0].src); }
                        panelLog('ChannelIO.q length -> ' + ((window.ChannelIO && window.ChannelIO.q && window.ChannelIO.q.length) || 0));

                        if(!(window.ChannelIO && typeof ChannelIO === 'function')){
                            panelLog('ChannelIO not present — attempting manual script injection');
                            tryLoadPlugin('https://cdn.channel.io/plugin/ch-plugin-web.js', function(err){
                                if(err){ panelLog('Manual script injection failed — check network/CSP/adblock'); }
                                else {
                                    panelLog('Manual injection completed — attempting boot');
                                    try{ if(window.ChannelIO) { ChannelIO('boot', { pluginKey: '95f4325f-b42a-4634-850c-6f96dbfa0645' }); panelLog('ChannelIO boot called'); } else { panelLog('ChannelIO still undefined after script load'); } }catch(e){ panelLog('boot call error: '+e); }
                                }
                            });
                        } else { panelLog('ChannelIO is present — try clicking launcher'); }
                    }

                    window.runChannelIODiagPanel = function(){ createPanel(); runFullDiag(); };
                    if(location.search.indexOf('cioDiag=1')>-1){ if(document.readyState==='complete'){ setTimeout(window.runChannelIODiagPanel,200); } else { window.addEventListener('load', function(){ setTimeout(window.runChannelIODiagPanel,200); }); } }
                })();
                </script>
