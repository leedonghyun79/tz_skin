<div module="Layout_SearchHeader">
    <!--@css(/css/module/layout/searchHeader.css)-->
    <!--
        $product_page=/product/detail.html
        $category_page=/product/list.html
    -->
    <h3 class="title">Search</h3>
    <fieldset>
        <legend>검색</legend>
        {$form.keyword}
        <script>
            if(document.getElementById('keyword')) {
                document.getElementById('keyword').placeholder = '찾으실 상품을 입력해주세요';
            }
        </script>
        <button type="button" class="btnSearch"
            onclick="{$action_search_submit}"><!--@import(/svg/icon-search.html)--> 검색</button>
        <ul class="autoDrop" id="{$search_auto_id}"></ul>
    </fieldset>
    <button type="button" class="btnClose"><i aria-hidden="true" class="icon icoClose"></i>닫기</button>
</div>
