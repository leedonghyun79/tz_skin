<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카페24 삼성 키오스크 옵션가 계산기</title>
<style>
    body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; margin-top:0; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input[type="number"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
    .result-box { margin-top: 20px; padding: 20px; background: #e8f0fe; border-radius: 8px; border: 1px solid #cddc39; }
    .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
    .result-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .result-name { font-weight: bold; color: #444; }
    .result-value { font-weight: bold; color: #d32f2f; font-size: 18px; cursor: pointer; background: #fff; padding: 2px 8px; border-radius: 4px; border: 1px solid #ffcdd2; transition: 0.2s;}
    .result-value:hover { background: #ffebee; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: white; padding: 10px 20px; border-radius: 20px; display: none; }
    .desc { font-size: 13px; color: #666; margin-top: 5px; margin-bottom: 15px; line-height: 1.4; }
</style>
</head>
<body>
<div class="container">
    <h1>🛒 카페24 마이너스 옵션 계산기</h1>
    <p class="desc">상품의 기본 판매가를 입력하면, 카페24 옵션창에 <b>입력해야 할 추가금액(마이너스 값)</b>을 자동으로 계산해줍니다. <br/>금액을 클릭하면 자동으로 <b>복사(Copy)</b> 됩니다!</p>

    <label for="basePrice">💰 본품 판매가 (예: 2640000)</label>
    <input type="number" id="basePrice" placeholder="판매가를 숫자만 입력하세요" oninput="calculate()">

    <label for="modelType">📦 설치비 예외 모델 (QH65C-SW 등)</label>
    <select id="modelType" onchange="calculate()">
        <option value="normal">일반 모델 (설치비 99,000원 기준)</option>
        <option value="special">예외 모델 (설치비 330,000원 기준)</option>
    </select>

    <div class="result-box">
        <div class="result-row"><span class="result-name">안드로이드/PC 타입 T-CMS 3년 (33만)</span><span class="result-value" onclick="copyVal('tcms')"><span id="tcms">0</span></span></div>
        <div class="result-row"><span class="result-name">정전압식 터치 (77만)</span><span class="result-value" onclick="copyVal('touch')"><span id="touch">0</span></span></div>
        <div class="result-row"><span class="result-name">스피커 추가함 (5.5만)</span><span class="result-value" onclick="copyVal('spk')"><span id="spk">0</span></span></div>
        <div class="result-row"><span class="result-name">이동형 바퀴 부착함 (4.4만)</span><span class="result-value" onclick="copyVal('wheel')"><span id="wheel">0</span></span></div>
        <div class="result-row"><span class="result-name">직접설치/비용문의 (0원 처리를 위해)</span><span class="result-value" onclick="copyVal('zero')"><span id="zero">0</span></span></div>
        <div class="result-row"><span class="result-name">설치/교육비 (설치비 부과)</span><span class="result-value" onclick="copyVal('install')"><span id="install">0</span></span></div>
    </div>
</div>
<div id="toast" class="toast">복사되었습니다!</div>

<script>
    function fmt(val) {
        return val;
    }

    function calculate() {
        let base = parseInt(document.getElementById('basePrice').value);
        if(isNaN(base) || base === 0) {
            document.getElementById('tcms').innerText = '0';
            document.getElementById('touch').innerText = '0';
            document.getElementById('spk').innerText = '0';
            document.getElementById('wheel').innerText = '0';
            document.getElementById('zero').innerText = '0';
            document.getElementById('install').innerText = '0';
            return;
        }

        let isSpecial = document.getElementById('modelType').value === 'special';
        let installTarget = isSpecial ? 330000 : 99000;

        document.getElementById('tcms').innerText = fmt(330000 - base);
        document.getElementById('touch').innerText = fmt(770000 - base);
        document.getElementById('spk').innerText = fmt(55000 - base);
        document.getElementById('wheel').innerText = fmt(44000 - base);
        document.getElementById('zero').innerText = fmt(-base);
        document.getElementById('install').innerText = fmt(installTarget - base);
    }

    function copyVal(id) {
        let text = document.getElementById(id).innerText;
        if(text === '0') return;
        navigator.clipboard.writeText(text).then(() => {
            let toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1500);
        });
    }
</script>
</body>
</html>
